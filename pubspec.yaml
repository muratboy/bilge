name: bilge
description: "Her konuyu seviye seviye, oynayarak öğren."
publish_to: 'none'
version: 0.15.0-beta+1500

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:     # hazır bileşenlerin (metin menüsü vb.) çevirileri
    sdk: flutter
  path_parsing: ^1.1.0       # maskot çizimlerindeki yol tanımlarını okur
  path_provider: ^2.1.6      # kayıt dosyasının yeri
  share_plus: ^13.3.0        # kurs ve yedek paylaşma
  file_selector: ^1.0.0      # dosyadan kurs / yedek alma
  http: ^1.6.0               # bağlantıdan kurs alma
  audioplayers: ^6.0.0       # ses efektleri
  flutter_math_fork: ^0.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/courses/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
        - asset: assets/fonts/Nunito-900.ttf
          weight: 900
